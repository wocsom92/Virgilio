filebeat.inputs:
  - type: filestream
    id: docker-json-logs
    enabled: true
    prospector.scanner.symlinks: true
    parsers:
      - container:
          stream: all
          format: docker
    paths:
      - /var/lib/docker/containers/*/*-json.log
    processors:
      - add_docker_metadata:
          host: "unix:///var/run/docker.sock"
      - drop_event:
          when:
            not:
              regexp:
                container.name: '^/?server-monitor-(backend|frontend|agent|telegram-bot)$'
      - decode_json_fields:
          fields: ["message"]
          target: ""
          overwrite_keys: true
          add_error_key: true

processors:
  - add_host_metadata: ~

setup.ilm.enabled: false
setup.template.name: "server-monitor-logs"
setup.template.pattern: "server-monitor-logs-*"
setup.template.settings:
  index.number_of_shards: 1
  index.number_of_replicas: 0

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "server-monitor-logs-%{+yyyy.MM.dd}"

logging.json: true
logging.metrics.enabled: false
monitoring.enabled: false
