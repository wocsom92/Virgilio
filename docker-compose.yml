services:
  db:
    image: mysql:8.0
    container_name: server-monitor-db
    command:
      - --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pchangeme"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: server-monitor-backend
    privileged: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_MONITOR_DEBUG: ${SERVER_MONITOR_DEBUG}
      SERVER_MONITOR_LOG_LEVEL: ${SERVER_MONITOR_LOG_LEVEL:-INFO}
      SERVER_MONITOR_DB_USER: ${SERVER_MONITOR_DB_USER}
      SERVER_MONITOR_DB_PASSWORD: ${SERVER_MONITOR_DB_PASSWORD}
      SERVER_MONITOR_DB_HOST: ${SERVER_MONITOR_DB_HOST}
      SERVER_MONITOR_DB_PORT: ${SERVER_MONITOR_DB_PORT}
      SERVER_MONITOR_DB_NAME: ${SERVER_MONITOR_DB_NAME}
      SERVER_MONITOR_HISTORY_DB_NAME: ${SERVER_MONITOR_HISTORY_DB_NAME:-backend_monitor}
      SERVER_MONITOR_AUTH_SECRET_KEY: ${SERVER_MONITOR_AUTH_SECRET_KEY}
      SERVER_MONITOR_AUTH_ACCESS_TOKEN_EXP_MINUTES: ${SERVER_MONITOR_AUTH_ACCESS_TOKEN_EXP_MINUTES:-1440}
      SERVER_MONITOR_TELEGRAM_BOT_TOKEN: ${SERVER_MONITOR_TELEGRAM_BOT_TOKEN}
      SERVER_MONITOR_TELEGRAM_DEFAULT_CHAT_ID: ${SERVER_MONITOR_TELEGRAM_DEFAULT_CHAT_ID}
      SERVER_MONITOR_TELEGRAM_PROXY_URL: ${SERVER_MONITOR_TELEGRAM_PROXY_URL:-}
      SERVER_MONITOR_TELEGRAM_BIND_INTERFACE: ${SERVER_MONITOR_TELEGRAM_BIND_INTERFACE:-}
      SERVER_MONITOR_TELEGRAM_LOCAL_ADDRESS: ${SERVER_MONITOR_TELEGRAM_LOCAL_ADDRESS:-}
      SERVER_MONITOR_TELEGRAM_ALLOWED_USERS: ${SERVER_MONITOR_TELEGRAM_ALLOWED_USERS:-[]}
      SERVER_MONITOR_MONITOR_REQUEST_TIMEOUT_SECONDS: ${SERVER_MONITOR_MONITOR_REQUEST_TIMEOUT_SECONDS}
      SERVER_MONITOR_CORS_ALLOW_ORIGINS: ${SERVER_MONITOR_CORS_ALLOW_ORIGINS}
      SERVER_MONITOR_ALLOW_HOST_REBOOT: ${SERVER_MONITOR_ALLOW_HOST_REBOOT:-false}
      SERVER_MONITOR_REBOOT_COMMAND: "${SERVER_MONITOR_REBOOT_COMMAND:-/sbin/shutdown -r now}"
    ports:
      - "${SERVER_MONITOR_PORT:-28000}:8000"
    labels:
      co.elastic.logs/enabled: "true"
    volumes:
      - type: bind
        source: ${MONITOR_HOST_ROOT_SOURCE:-./docker/monitor/host-root-placeholder}
        target: ${MONITOR_HOST_ROOT_TARGET:-/hostfs}
        read_only: true
    extra_hosts:
      - "host.docker.internal:host-gateway"

  monitor:
    build:
      context: .
      dockerfile: monitor/Dockerfile
    container_name: "${MONITOR_CONTAINER_NAME:-server-monitor-agent}"
    privileged: true
    restart: unless-stopped
    environment:
      MONITOR_DEBUG: ${MONITOR_DEBUG}
      MONITOR_LOG_LEVEL: ${MONITOR_LOG_LEVEL:-INFO}
      MONITOR_API_TOKEN: ${MONITOR_API_TOKEN}
      MONITOR_MOUNTED_POINTS: '${MONITOR_MOUNTED_POINTS:-["auto"]}'
      MONITOR_EXPOSE_DOCKER_RUNNING_CONTAINERS: ${MONITOR_EXPOSE_DOCKER_RUNNING_CONTAINERS:-false}
      MONITOR_HOST_ROOT_SOURCE: ${MONITOR_HOST_ROOT_SOURCE:-}
      MONITOR_HOST_ROOT_TARGET: ${MONITOR_HOST_ROOT_TARGET:-/hostfs}
      MONITOR_HISTORY_RETENTION_SECONDS: ${MONITOR_HISTORY_RETENTION_SECONDS:-86400}
      MONITOR_HISTORY_MAX_ENTRIES: ${MONITOR_HISTORY_MAX_ENTRIES:-1440}
      MONITOR_ALLOW_HOST_REBOOT: ${MONITOR_ALLOW_HOST_REBOOT:-false}
      MONITOR_REBOOT_COMMAND: "${MONITOR_REBOOT_COMMAND:-/sbin/shutdown -r now}"
    ports:
      - "${MONITOR_PORT:-29000}:9000"
    labels:
      co.elastic.logs/enabled: "true"
    volumes:
      - type: bind
        source: ${MONITOR_HOST_ROOT_SOURCE:-./docker/monitor/host-root-placeholder}
        target: ${MONITOR_HOST_ROOT_TARGET:-/hostfs}
        read_only: true

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:28000}"
    container_name: server-monitor-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    labels:
      co.elastic.logs/enabled: "true"

  telegram-bot:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: server-monitor-telegram-bot
    privileged: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "backend.app.bot.polling"]
    environment:
      SERVER_MONITOR_DEBUG: ${SERVER_MONITOR_DEBUG}
      SERVER_MONITOR_LOG_LEVEL: ${SERVER_MONITOR_LOG_LEVEL:-INFO}
      SERVER_MONITOR_DB_USER: ${SERVER_MONITOR_DB_USER}
      SERVER_MONITOR_DB_PASSWORD: ${SERVER_MONITOR_DB_PASSWORD}
      SERVER_MONITOR_DB_HOST: ${SERVER_MONITOR_DB_HOST}
      SERVER_MONITOR_DB_PORT: ${SERVER_MONITOR_DB_PORT}
      SERVER_MONITOR_DB_NAME: ${SERVER_MONITOR_DB_NAME}
      SERVER_MONITOR_HISTORY_DB_NAME: ${SERVER_MONITOR_HISTORY_DB_NAME:-backend_monitor}
      SERVER_MONITOR_TELEGRAM_BOT_TOKEN: ${SERVER_MONITOR_TELEGRAM_BOT_TOKEN}
      SERVER_MONITOR_TELEGRAM_DEFAULT_CHAT_ID: ${SERVER_MONITOR_TELEGRAM_DEFAULT_CHAT_ID}
      SERVER_MONITOR_TELEGRAM_PROXY_URL: ${SERVER_MONITOR_TELEGRAM_PROXY_URL:-}
      SERVER_MONITOR_TELEGRAM_BIND_INTERFACE: ${SERVER_MONITOR_TELEGRAM_BIND_INTERFACE:-}
      SERVER_MONITOR_TELEGRAM_LOCAL_ADDRESS: ${SERVER_MONITOR_TELEGRAM_LOCAL_ADDRESS:-}
      SERVER_MONITOR_TELEGRAM_ALLOWED_USERS: ${SERVER_MONITOR_TELEGRAM_ALLOWED_USERS}
    labels:
      co.elastic.logs/enabled: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  telegram-egress-proxy:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: server-monitor-telegram-egress-proxy
    profiles: ["telegram-egress"]
    privileged: true
    network_mode: host
    restart: unless-stopped
    command: ["python", "-m", "backend.app.tools.telegram_egress_proxy"]
    environment:
      SERVER_MONITOR_LOG_LEVEL: ${SERVER_MONITOR_LOG_LEVEL:-INFO}
      TELEGRAM_EGRESS_PROXY_LISTEN_HOST: ${TELEGRAM_EGRESS_PROXY_LISTEN_HOST:-0.0.0.0}
      TELEGRAM_EGRESS_PROXY_LISTEN_PORT: ${TELEGRAM_EGRESS_PROXY_LISTEN_PORT:-18080}
      TELEGRAM_EGRESS_PROXY_CONNECT_TIMEOUT_SECONDS: ${TELEGRAM_EGRESS_PROXY_CONNECT_TIMEOUT_SECONDS:-10}
      TELEGRAM_EGRESS_PROXY_UPSTREAM_PROXY_URL: ${TELEGRAM_EGRESS_PROXY_UPSTREAM_PROXY_URL:-http://127.0.0.1:10809}
      TELEGRAM_EGRESS_PROXY_BIND_INTERFACE: ${TELEGRAM_EGRESS_PROXY_BIND_INTERFACE:-}
      TELEGRAM_EGRESS_PROXY_LOCAL_ADDRESS: ${TELEGRAM_EGRESS_PROXY_LOCAL_ADDRESS:-}
      TELEGRAM_EGRESS_PROXY_ALLOWED_CLIENT_CIDRS: ${TELEGRAM_EGRESS_PROXY_ALLOWED_CLIENT_CIDRS:-127.0.0.1/32,172.16.0.0/12}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; import sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:18080/healthz', timeout=5).read() == b'ok' else 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
    labels:
      co.elastic.logs/enabled: "true"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_STACK_VERSION:-9.3.1}
    container_name: server-monitor-elasticsearch
    profiles: ["logs"]
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: "${ELASTICSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}"
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_STACK_VERSION:-9.3.1}
    container_name: server-monitor-kibana
    profiles: ["logs"]
    restart: unless-stopped
    depends_on:
      - elasticsearch
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      NODE_OPTIONS: "${KIBANA_NODE_OPTIONS:---max-old-space-size=384}"
      XPACK_SECURITY_ENABLED: "false"
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:-server-monitor-kibana-key-32chars}
    ports:
      - "${KIBANA_PORT:-5601}:5601"

  filebeat:
    image: docker.elastic.co/beats/filebeat:${ELASTIC_STACK_VERSION:-9.3.1}
    container_name: server-monitor-filebeat
    user: root
    profiles: ["logs"]
    restart: unless-stopped
    depends_on:
      - elasticsearch
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./docker/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - filebeat-data:/usr/share/filebeat/data

volumes:
  mysql-data:
  elasticsearch-data:
  filebeat-data:
