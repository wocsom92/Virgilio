openapi: 3.1.0
info:
  title: Server Monitor API
  version: 0.1.0
paths:
  /auth/status:
    get:
      tags:
      - auth
      summary: Auth Status
      operationId: auth_status_auth_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatusResponse'
  /auth/bootstrap:
    post:
      tags:
      - auth
      summary: Bootstrap Admin
      operationId: bootstrap_admin_auth_bootstrap_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/login:
    post:
      tags:
      - auth
      summary: Login
      operationId: login_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/me:
    get:
      tags:
      - auth
      summary: Get Me
      operationId: get_me_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
      security:
      - OAuth2PasswordBearer: []
  /auth/users:
    get:
      tags:
      - auth
      summary: List Users
      operationId: list_users_auth_users_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/UserRead'
                type: array
                title: Response List Users Auth Users Get
      security:
      - OAuth2PasswordBearer: []
    post:
      tags:
      - auth
      summary: Create User
      operationId: create_user_auth_users_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /auth/users/{user_id}:
    delete:
      tags:
      - auth
      summary: Delete User
      operationId: delete_user_auth_users__user_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          title: User Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /backends/:
    get:
      tags:
      - backends
      summary: List Backends
      operationId: list_backends_backends__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/MonitoredBackendRead'
                type: array
                title: Response List Backends Backends  Get
      security:
      - OAuth2PasswordBearer: []
    post:
      tags:
      - backends
      summary: Create Backend
      operationId: create_backend_backends__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitoredBackendCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoredBackendRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /backends/with-latest:
    get:
      tags:
      - backends
      summary: List Backends With Latest
      operationId: list_backends_with_latest_backends_with_latest_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BackendWithLatestSnapshot'
                type: array
                title: Response List Backends With Latest Backends With Latest Get
      security:
      - OAuth2PasswordBearer: []
  /backends/{backend_id}:
    get:
      tags:
      - backends
      summary: Get Backend
      operationId: get_backend_backends__backend_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: backend_id
        in: path
        required: true
        schema:
          type: integer
          title: Backend Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoredBackendRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - backends
      summary: Update Backend
      operationId: update_backend_backends__backend_id__put
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: backend_id
        in: path
        required: true
        schema:
          type: integer
          title: Backend Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitoredBackendUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoredBackendRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - backends
      summary: Delete Backend
      operationId: delete_backend_backends__backend_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: backend_id
        in: path
        required: true
        schema:
          type: integer
          title: Backend Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /backends/{backend_id}/refresh:
    post:
      tags:
      - backends
      summary: Refresh Backend Metrics
      operationId: refresh_backend_metrics_backends__backend_id__refresh_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: backend_id
        in: path
        required: true
        schema:
          type: integer
          title: Backend Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsIngestResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /backends/{backend_id}/reboot:
    post:
      tags:
      - backends
      summary: Reboot Monitor Host
      operationId: reboot_monitor_host_backends__backend_id__reboot_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: backend_id
        in: path
        required: true
        schema:
          type: integer
          title: Backend Id
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Reboot Monitor Host Backends  Backend Id  Reboot Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /backends/{backend_id}/mounts:
    get:
      tags:
      - backends
      summary: List Backend Mounts
      operationId: list_backend_mounts_backends__backend_id__mounts_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: backend_id
        in: path
        required: true
        schema:
          type: integer
          title: Backend Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                title: Response List Backend Mounts Backends  Backend Id  Mounts Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /metrics/{backend_id}:
    post:
      tags:
      - metrics
      summary: Ingest Metrics
      operationId: ingest_metrics_metrics__backend_id__post
      parameters:
      - name: backend_id
        in: path
        required: true
        schema:
          type: integer
          title: Backend Id
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricSnapshotCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsIngestResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /metrics/{backend_id}/latest:
    get:
      tags:
      - metrics
      summary: Get Latest Snapshot
      operationId: get_latest_snapshot_metrics__backend_id__latest_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: backend_id
        in: path
        required: true
        schema:
          type: integer
          title: Backend Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsIngestResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /dashboard/:
    get:
      tags:
      - dashboard
      summary: Fetch Dashboard Data
      description: Backends with their newest snapshot, without the raw monitor payload.
      operationId: fetch_dashboard_data_dashboard__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BackendDashboardRead'
                type: array
                title: Response Fetch Dashboard Data Dashboard  Get
      security:
      - OAuth2PasswordBearer: []
  /dashboard/quick-status:
    get:
      tags:
      - dashboard
      summary: Fetch Quick Status Tiles
      operationId: fetch_quick_status_tiles_dashboard_quick_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/QuickStatusTileRead'
                type: array
                title: Response Fetch Quick Status Tiles Dashboard Quick Status Get
      security:
      - OAuth2PasswordBearer: []
  /dashboard/quick-status/history:
    get:
      tags:
      - dashboard
      summary: Fetch Quick Status Tile History
      description: 24h strips/series for the requested tiles; without ``tile_ids``
        every tile (and heartbeat).
      operationId: fetch_quick_status_tile_history_dashboard_quick_status_history_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: tile_ids
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: integer
          - type: 'null'
          title: Tile Ids
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuickStatusTileRead'
                title: Response Fetch Quick Status Tile History Dashboard Quick Status
                  History Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /dashboard/quick-status/{tile_id}/detail:
    get:
      tags:
      - dashboard
      summary: Fetch Quick Status Tile Detail
      operationId: fetch_quick_status_tile_detail_dashboard_quick_status__tile_id__detail_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: tile_id
        in: path
        required: true
        schema:
          type: integer
          title: Tile Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuickStatusTileRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /dashboard/site-monitors:
    get:
      tags:
      - dashboard
      summary: Fetch Site Monitor Statuses
      operationId: fetch_site_monitor_statuses_dashboard_site_monitors_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SiteMonitorStatusRead'
                type: array
                title: Response Fetch Site Monitor Statuses Dashboard Site Monitors
                  Get
      security:
      - OAuth2PasswordBearer: []
  /dashboard/{backend_id}/series:
    get:
      tags:
      - dashboard
      summary: Fetch Backend Series
      operationId: fetch_backend_series_dashboard__backend_id__series_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: backend_id
        in: path
        required: true
        schema:
          type: integer
          title: Backend Id
      - name: range_name
        in: query
        required: false
        schema:
          type: string
          default: hourly
          title: Range Name
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: max_points
        in: query
        required: false
        schema:
          type: integer
          maximum: 5000
          minimum: 10
          default: 300
          title: Max Points
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricSeriesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /notifications/:
    get:
      tags:
      - notifications
      summary: List Notifications
      operationId: list_notifications_notifications__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Page Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationCenterResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /notifications/unread-count:
    get:
      tags:
      - notifications
      summary: Unread Notifications Count
      description: 'Cheap badge endpoint: one indexed COUNT, no page payload.'
      operationId: unread_notifications_count_notifications_unread_count_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: integer
                type: object
                title: Response Unread Notifications Count Notifications Unread Count
                  Get
      security:
      - OAuth2PasswordBearer: []
  /notifications/read-all:
    post:
      tags:
      - notifications
      summary: Mark All Notifications Read
      operationId: mark_all_notifications_read_notifications_read_all_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  anyOf:
                  - type: integer
                  - type: string
                type: object
                title: Response Mark All Notifications Read Notifications Read All
                  Post
      security:
      - OAuth2PasswordBearer: []
  /system/reboot:
    post:
      tags:
      - system
      summary: Reboot Host
      operationId: reboot_host_system_reboot_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RebootRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Reboot Host System Reboot Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /system/db-size:
    get:
      tags:
      - system
      summary: Get Db Size
      description: Return the on-disk size of the SQLite database file plus its WAL.
      operationId: get_db_size_system_db_size_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Get Db Size System Db Size Get
      security:
      - OAuth2PasswordBearer: []
  /system/retention:
    get:
      tags:
      - system
      summary: Get Retention Settings
      operationId: get_retention_settings_system_retention_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionSettings'
      security:
      - OAuth2PasswordBearer: []
    put:
      tags:
      - system
      summary: Update Retention Settings
      operationId: update_retention_settings_system_retention_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetentionSettings'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionSettings'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /system/auth-session:
    get:
      tags:
      - system
      summary: Get Auth Session Settings
      operationId: get_auth_session_settings_system_auth_session_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionSettings'
      security:
      - OAuth2PasswordBearer: []
    put:
      tags:
      - system
      summary: Update Auth Session Settings
      operationId: update_auth_session_settings_system_auth_session_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthSessionSettings'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionSettings'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /system/quick-status:
    get:
      tags:
      - system
      summary: List Quick Status Items
      operationId: list_quick_status_items_system_quick_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/QuickStatusItemRead'
                type: array
                title: Response List Quick Status Items System Quick Status Get
      security:
      - OAuth2PasswordBearer: []
    post:
      tags:
      - system
      summary: Create Quick Status
      operationId: create_quick_status_system_quick_status_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuickStatusItemCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuickStatusItemRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /system/quick-status/{item_id}:
    put:
      tags:
      - system
      summary: Update Quick Status
      operationId: update_quick_status_system_quick_status__item_id__put
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: integer
          title: Item Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuickStatusItemCreate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuickStatusItemRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - system
      summary: Delete Quick Status
      operationId: delete_quick_status_system_quick_status__item_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: integer
          title: Item Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /system/site-monitors:
    get:
      tags:
      - system
      summary: List Site Monitor Items
      operationId: list_site_monitor_items_system_site_monitors_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SiteMonitorRead'
                type: array
                title: Response List Site Monitor Items System Site Monitors Get
      security:
      - OAuth2PasswordBearer: []
    post:
      tags:
      - system
      summary: Create Site Monitor Item
      operationId: create_site_monitor_item_system_site_monitors_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteMonitorCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteMonitorRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /system/site-monitors/{item_id}:
    put:
      tags:
      - system
      summary: Update Site Monitor Item
      operationId: update_site_monitor_item_system_site_monitors__item_id__put
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: integer
          title: Item Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteMonitorCreate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteMonitorRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - system
      summary: Delete Site Monitor Item
      operationId: delete_site_monitor_item_system_site_monitors__item_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: integer
          title: Item Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /telegram/settings:
    get:
