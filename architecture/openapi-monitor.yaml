openapi: 3.1.0
info:
  title: Backend Monitor
  version: 0.1.0
paths:
  /healthz:
    get:
      tags:
      - meta
      summary: Health
      operationId: health_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Healthz Get
  /metrics:
    get:
      summary: Get Metrics
      operationId: get_metrics_metrics_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /reboot:
    post:
      summary: Reboot Host
      operationId: reboot_host_reboot_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                title: Response Reboot Host Reboot Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /metrics/latest:
    get:
      summary: Latest Metrics
      operationId: latest_metrics_metrics_latest_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /ping:
    get:
      summary: Ping Target
      operationId: ping_target_ping_get
      parameters:
      - name: target
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
          title: Target
      - name: timeout_seconds
        in: query
        required: false
        schema:
          type: integer
          maximum: 30
          minimum: 1
          default: 1
          title: Timeout Seconds
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    CPULoad:
      properties:
        one:
          anyOf:
          - type: number
          - type: 'null'
          title: One
        five:
          anyOf:
          - type: number
          - type: 'null'
          title: Five
        fifteen:
          anyOf:
          - type: number
          - type: 'null'
          title: Fifteen
      type: object
      title: CPULoad
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    MetricPayload:
      properties:
        reported_at:
          type: string
          format: date-time
          title: Reported At
        hostname:
          anyOf:
          - type: string
          - type: 'null'
          title: Hostname
        monitor_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Monitor Version
        cpu_temperature_c:
          anyOf:
          - type: number
          - type: 'null'
          title: Cpu Temperature C
        ram_used_percent:
          anyOf:
          - type: number
          - type: 'null'
          title: Ram Used Percent
        total_ram_gb:
          anyOf:
          - type: number
          - type: 'null'
          title: Total Ram Gb
        memory_available_gb:
          anyOf:
          - type: number
          - type: 'null'
          title: Memory Available Gb
        swap_used_percent:
          anyOf:
          - type: number
          - type: 'null'
          title: Swap Used Percent
        docker_container_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Docker Container Count
        docker_running_containers:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Docker Running Containers
        disk_usage_percent:
          anyOf:
          - type: number
          - type: 'null'
          title: Disk Usage Percent
        disk_total_gb:
          anyOf:
          - type: number
          - type: 'null'
          title: Disk Total Gb
        disk_available_gb:
          anyOf:
          - type: number
          - type: 'null'
          title: Disk Available Gb
        mounted_usage:
          anyOf:
          - items:
              $ref: '#/components/schemas/MountedVolume'
            type: array
          - type: 'null'
          title: Mounted Usage
        cpu_load:
          anyOf:
          - $ref: '#/components/schemas/CPULoad'
          - type: 'null'
        network_counters:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Network Counters
        disk_temperatures:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Disk Temperatures
        os_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Os Version
        uptime_seconds:
          anyOf:
          - type: integer
          - type: 'null'
          title: Uptime Seconds
        ssh_last_successful_login_seconds:
          anyOf:
          - type: integer
          - type: 'null'
          title: Ssh Last Successful Login Seconds
        ssh_last_successful_auth_method:
          anyOf:
          - type: string
          - type: 'null'
          title: Ssh Last Successful Auth Method
        ssh_last_successful_username:
          anyOf:
          - type: string
          - type: 'null'
          title: Ssh Last Successful Username
        ssh_last_successful_source_ip:
          anyOf:
          - type: string
          - type: 'null'
          title: Ssh Last Successful Source Ip
        ssh_last_successful_port:
          anyOf:
          - type: integer
          - type: 'null'
          title: Ssh Last Successful Port
        ssh_last_successful_line:
          anyOf:
          - type: string
          - type: 'null'
          title: Ssh Last Successful Line
        ssh_last_unsuccessful_attempt_seconds:
          anyOf:
          - type: integer
          - type: 'null'
          title: Ssh Last Unsuccessful Attempt Seconds
        ssh_last_failure_auth_method:
          anyOf:
          - type: string
          - type: 'null'
          title: Ssh Last Failure Auth Method
        ssh_last_failure_username:
          anyOf:
          - type: string
          - type: 'null'
          title: Ssh Last Failure Username
        ssh_last_failure_source_ip:
          anyOf:
          - type: string
          - type: 'null'
          title: Ssh Last Failure Source Ip
        ssh_last_failure_port:
          anyOf:
          - type: integer
          - type: 'null'
          title: Ssh Last Failure Port
        ssh_last_failure_line:
          anyOf:
          - type: string
          - type: 'null'
          title: Ssh Last Failure Line
        ssh_pubkey_auth_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Ssh Pubkey Auth Enabled
        ssh_root_password_login_disabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Ssh Root Password Login Disabled
        ssh_password_auth_disabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Ssh Password Auth Disabled
        ssh_kbd_interactive_auth_disabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Ssh Kbd Interactive Auth Disabled
        ssh_permit_root_login_mode:
          anyOf:
          - type: string
          - type: 'null'
          title: Ssh Permit Root Login Mode
        ssh_pubkey_auth_line:
          anyOf:
          - type: string
          - type: 'null'
          title: Ssh Pubkey Auth Line
        ssh_password_auth_line:
          anyOf:
          - type: string
          - type: 'null'
          title: Ssh Password Auth Line
        ssh_kbd_interactive_auth_line:
          anyOf:
          - type: string
          - type: 'null'
          title: Ssh Kbd Interactive Auth Line
        ssh_permit_root_login_line:
          anyOf:
          - type: string
          - type: 'null'
          title: Ssh Permit Root Login Line
        ssh_status_level:
          anyOf:
          - type: integer
          - type: 'null'
          title: Ssh Status Level
        ssh_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Ssh Status
        telegram_bot_status_level:
          anyOf:
          - type: integer
          - type: 'null'
          title: Telegram Bot Status Level
        telegram_bot_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Telegram Bot Status
        telegram_bot_running:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Telegram Bot Running
        telegram_egress_proxy_running:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Telegram Egress Proxy Running
        wifi_status_level:
          anyOf:
          - type: integer
          - type: 'null'
          title: Wifi Status Level
        wifi_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Wifi Status
        wifi_ssid:
          anyOf:
          - type: string
          - type: 'null'
          title: Wifi Ssid
        wifi_interface:
          anyOf:
          - type: string
          - type: 'null'
          title: Wifi Interface
        wifi_client_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Wifi Client Count
        wifi_associated_clients:
          anyOf:
          - items:
              $ref: '#/components/schemas/WifiAssociatedStation'
            type: array
          - type: 'null'
          title: Wifi Associated Clients
        wifi_dhcp_lease_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Wifi Dhcp Lease Count
        wifi_operstate:
          anyOf:
          - type: string
          - type: 'null'
          title: Wifi Operstate
        wifi_hostapd_socket_present:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Wifi Hostapd Socket Present
        vpn_status_level:
          anyOf:
          - type: integer
          - type: 'null'
          title: Vpn Status Level
        vpn_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Vpn Status
        vpn_active_backend:
          anyOf:
          - type: string
          - type: 'null'
          title: Vpn Active Backend
        vpn_hotspot_public_ip:
          anyOf:
          - type: string
          - type: 'null'
          title: Vpn Hotspot Public Ip
        vpn_hotspot_probe_service:
          anyOf:
          - type: string
          - type: 'null'
          title: Vpn Hotspot Probe Service
        vpn_hotspot_country_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Vpn Hotspot Country Code
        vpn_expected_public_ip:
          anyOf:
          - type: string
          - type: 'null'
          title: Vpn Expected Public Ip
        vpn_expected_probe_service:
          anyOf:
          - type: string
          - type: 'null'
          title: Vpn Expected Probe Service
        vpn_expected_country_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Vpn Expected Country Code
        vpn_default_public_ip:
          anyOf:
          - type: string
          - type: 'null'
          title: Vpn Default Public Ip
        vpn_default_probe_service:
          anyOf:
          - type: string
          - type: 'null'
          title: Vpn Default Probe Service
        vpn_default_country_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Vpn Default Country Code
        warnings:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Warnings
        configured_mounts:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Configured Mounts
        raw_payload:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Raw Payload
      type: object
      required:
      - reported_at
      title: MetricPayload
    MetricResponse:
      properties:
        metrics:
          $ref: '#/components/schemas/MetricPayload'
      type: object
      required:
      - metrics
      title: MetricResponse
    MountedVolume:
      properties:
        mount_point:
          type: string
          title: Mount Point
        total_gb:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Total Gb
        used_percent:
          anyOf:
          - type: number
            maximum: 100.0
            minimum: 0.0
          - type: 'null'
          title: Used Percent
      type: object
      required:
      - mount_point
      title: MountedVolume
    PingResponse:
      properties:
        target:
          type: string
          title: Target
        success:
          type: boolean
          title: Success
        latency_ms:
          anyOf:
          - type: number
          - type: 'null'
          title: Latency Ms
        checked_at:
          type: string
          format: date-time
          title: Checked At
      type: object
      required:
      - target
      - success
      - checked_at
      title: PingResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    WifiAssociatedStation:
      properties:
        mac:
          type: string
          title: Mac
        signal_dbm:
          anyOf:
          - type: integer
          - type: 'null'
          title: Signal Dbm
      type: object
      required:
      - mac
      title: WifiAssociatedStation
